<!-- index.html (Clean & Fully Responsive PWA) -->
<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Darkfolio | Akinbo Gem</title>

  <!-- Manifest and theme color for PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">

  <!-- Styles & Scripts -->
  <link rel="stylesheet" href="assets/css/style.css">
  <script defer src="assets/js/main.js"></script>
  <script defer src="assets/js/terminal.js"></script>
  <script defer src="assets/js/ai-avatar.js"></script>
  <script defer src="assets/js/3d-effects.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>

  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(0, 255, 153, 0.05);
      padding: 15px 20px;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(0, 255, 153, 0.2);
      width: 100%;
      overflow-x: auto;
    }
    .nav-bar ul {
      list-style: none;
      display: flex;
      flex-wrap: nowrap;
      justify-content: flex-start;
      gap: 16px;
      padding: 0;
      margin: 0;
      overflow-x: auto;
    }
    .nav-bar ul li a {
      text-decoration: none;
      color: #00ff99;
      font-weight: bold;
      position: relative;
      white-space: nowrap;
    }
    .nav-bar ul li a.active {
      color: #ffffff;
      border-bottom: 2px solid #00ff99;
    }
    .nav-bar ul li a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      left: 0;
      bottom: -4px;
      background-color: #1affd5;
      transition: width 0.3s ease;
    }
    .nav-bar ul li a:hover::after {
      width: 100%;
    }
    section {
      padding: 80px 20px;
      max-width: 960px;
      margin: auto;
      border-bottom: 1px solid rgba(0, 255, 153, 0.1);
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.6s ease-out;
    }
    section.reveal {
      opacity: 1;
      transform: none;
    }
    .hero-card {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(to right, rgba(0,255,153,0.1), rgba(0,255,255,0.1));
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(0,255,153,0.2);
    }
    .hero-card h1 {
      font-size: 2.5rem;
      color: #1affd5;
      margin-bottom: 10px;
    }
    .hero-card h2 {
      font-size: 1.2rem;
      color: #00ff99;
      margin-bottom: 20px;
    }
    .cta-button {
      display: inline-block;
      padding: 12px 24px;
      background-color: #00ff99;
      color: #000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      transition: background 0.3s;
    }
    .cta-button:hover {
      background-color: #00ffaa;
    }
    .stats-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 24px;
      margin-top: 40px;
    }
    .stat {
      background: #111;
      border: 1px solid #00ff99;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 10px rgba(0,255,153,0.4);
      color: #1affd5;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 500px;
      margin: auto;
    }
    input, textarea {
      padding: 12px;
      background: #111;
      border: 1px solid #00ff99;
      color: #fff;
      border-radius: 6px;
      font-size: 1em;
    }
    button[type="submit"] {
      padding: 12px;
      background: #00ff99;
      color: #000;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button[type="submit"]:hover {
      background: #00ffaa;
    }
    footer {
      text-align: center;
      padding: 30px;
      color: #888;
      font-size: 0.9em;
    }
    #installBtn {
      margin-top: 10px;
      background: #111;
      border: 1px solid #0f0;
      color: #0f0;
      padding: 10px 16px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.9em;
    }
    @media screen and (max-width: 768px) {
      .hero-card h1 {
        font-size: 2em;
      }
      .hero-card h2 {
        font-size: 1em;
      }
      .cta-button {
        padding: 10px 20px;
        font-size: 0.9em;
      }
    }
  </style>
</head>
<body>
  <div id="loader"><div class="glitch-cube"></div></div>
  <div id="terminal-intro"></div>
  <nav class="nav-bar">
    <ul>
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#blog">Blog</a></li>
      <li><a href="#skills">Skills</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#contact">Contact</a></li>
      <li><a href="#market">Black Market</a></li>
    </ul>
  </nav>

  <div id="main-content" class="hidden">
    <!-- Section content remains unchanged -->
    <div id="ai-avatar"></div>
    <div id="footer">
      <footer>
        <p>&copy; 2025 Akinbo Gem. All Rights Reserved.</p>
        <button id="installBtn" style="display: none;">Install App</button>
      </footer>
    </div>
  </div>

  <script>
    let deferredPrompt;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const installBtn = document.getElementById('installBtn');
      installBtn.style.display = 'block';
      installBtn.addEventListener('click', () => {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('App installed ✅');
          }
          deferredPrompt = null;
        });
      });
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./service-worker.js')
          .then((reg) => console.log('Service worker registered ✅'))
          .catch((err) => console.error('Service worker failed ❌', err));
      });
    }

    function toggleDarkMode() {
      document.body.classList.toggle('light-mode');
    }

    window.addEventListener('scroll', () => {
      document.querySelectorAll('section').forEach(sec => {
        const top = window.scrollY;
        const offset = sec.offsetTop - 150;
        const height = sec.offsetHeight;
        if (top >= offset && top < offset + height) {
          document.querySelectorAll('nav ul li a').forEach(link => {
            link.classList.remove('active');
            if (link.getAttribute('href').substring(1) === sec.id) {
              link.classList.add('active');
            }
          });
        }
        const windowHeight = window.innerHeight;
        const sectionTop = sec.getBoundingClientRect().top;
        if (sectionTop < windowHeight - 100) {
          sec.classList.add('reveal');
        }
      });
    });
  </script>
</body>
</html>
